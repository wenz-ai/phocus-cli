name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: xcrun swiftc -typecheck native/HNNR.swift
      - run: python -m unittest -v test_phocus tests.test_frames tests.test_tone
      - run: python tests/test_mcp.py -v
      - name: Test the Mac installer
        run: |
          /bin/bash "./安装 Phocus.command"
          "$HOME/.local/bin/phocus" --version
          "$HOME/.local/bin/phocus" capabilities
          test -s "$HOME/.codex/skills/phocus-photo/SKILL.md"
